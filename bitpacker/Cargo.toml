[package]
name = "velocore-bitpacker"
version = "0.10.0"
edition = "2024"
authors = ["Paul Masurel <paul.masurel@gmail.com>"]
license = "MIT"
categories = []
description = """VeloCore sub-crate: bitpacking"""
repository = "https://github.com/codefin-lab/velocore"
keywords = []
documentation = "https://docs.rs/velocore-bitpacker/latest/velocore_bitpacker"
