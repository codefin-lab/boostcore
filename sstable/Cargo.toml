[package]
name = "velocore-sstable"
version = "0.7.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/codefin-lab/velocore"
repository = "https://github.com/codefin-lab/velocore"
keywords = ["search", "information", "retrieval", "sstable"]
categories = ["database-implementations", "data-structures", "compression"]
description = "sstables for VeloCore, a fork of tantivy"

[dependencies]
common = {version= "0.11", path="../common", package="velocore-common"}
futures-util = "0.3.30"
itertools = "0.14.0"
velocore-bitpacker = { version= "0.10", path="../bitpacker" }
tantivy-fst = "0.5"
# experimental gives us access to Decompressor::upper_bound
zstd = { version = "0.13", optional = true, features = ["experimental"] }

[features]
zstd-compression = ["zstd"]

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
names = "0.14"
rand = "0.9"

[[bench]]
name = "stream_bench"
harness = false

[[bench]]
name = "ord_to_term"
harness = false

